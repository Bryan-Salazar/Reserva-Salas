<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Salas de Sistemas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 relative">

    <div id="login-view" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-[#0099db]">Reserva de Salas</h2>
            <div class="flex justify-center mb-6">
                <img 
                    src="https://i.postimg.cc/qM00rjxt/ESCUDO-INTEP-H.png" 
                    alt="Logo Sistema"
                    class="w-32 h-auto"
                >
            </div>
            <form id="login-form">
                <div class="mb-4"><label class="block text-sm font-medium mb-1">Usuario</label><input type="text" id="username" class="w-full border p-2 rounded focus:ring-blue-500 focus:border-blue-500" required></div>
                <div class="mb-6"><label class="block text-sm font-medium mb-1">Contraseña</label><input type="password" id="password" class="w-full border p-2 rounded focus:ring-blue-500 focus:border-blue-500" required></div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Ingresar</button>
                <p id="login-error" class="text-red-500 text-sm mt-3 hidden text-center"></p>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="hidden min-h-screen flex flex-col">
        <nav class="bg-[#005c9e] text-white p-4 shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Gestión de Salas</h1>
                <p id="user-info" class="text-sm text-blue-200"></p>
            </div>
            <div class="flex items-center space-x-3">
                <button id="btn-modal-password" class="text-sm hover:text-blue-200 underline font-medium">Cambiar Contraseña</button>
                <button id="btn-modal-salas"class="hidden bg-slate-600 hover:bg-slate-700 text-white px-3 py-1.5 rounded font-bold text-sm shadow-sm transition-colors">Gestionar Salas</button>
                <button id="btn-modal-usuarios"class="hidden bg-slate-600 hover:bg-slate-700 text-white px-3 py-1.5 rounded font-bold text-sm shadow-sm transition-colors">Nuevo Usuario</button>                
                <button id="btn-logout" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-bold text-sm shadow-sm transition-colors">Cerrar Sesión</button>
            </div>
        </nav>

        <main class="flex-1 p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="bg-white p-6 rounded-lg shadow-md md:col-span-1 h-fit">
                <h3 class="text-lg font-bold mb-4 border-b pb-2">Nueva Reserva de Sala</h3>
                <form id="reserva-form" class="space-y-3 text-sm">
                    <div><label class="font-medium">Sala</label><select id="sala_id" class="w-full border p-2 rounded" required></select></div>
                    <div><label class="font-medium">Docente</label><input type="text" id="docente" class="w-full border p-2 rounded" required></div>
                    <div><label class="font-medium">Asignatura</label><input type="text" id="asignatura" class="w-full border p-2 rounded" required></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="font-medium">Fecha Inicio</label><input type="date" id="fecha_inicio" class="w-full border p-2 rounded" required></div>
                        <div><label class="font-medium">Fecha Fin</label><input type="date" id="fecha_fin" class="w-full border p-2 rounded" required></div>
                    </div>
                    <div>
                        <label class="font-medium">Día de la semana</label>
                        <select id="dia_semana" class="w-full border p-2 rounded" required>
                            <option value="LUNES">Lunes</option><option value="MARTES">Martes</option><option value="MIERCOLES">Miércoles</option>
                            <option value="JUEVES">Jueves</option><option value="VIERNES">Viernes</option><option value="SABADO">Sábado</option><option value="DOMINGO">Domingo</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="font-medium">Hora Inicio</label><input type="time" id="hora_inicio" class="w-full border p-2 rounded" required></div>
                        <div><label class="font-medium">Hora Fin</label><input type="time" id="hora_fin" class="w-full border p-2 rounded" required></div>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700 font-bold mt-4 shadow-sm">Solicitar Reserva</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md md:col-span-2">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-lg font-bold">Cronograma</h3>
                    <div class="flex items-center space-x-3">
                        <button id="btn-vista" type="button" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded font-bold transition-colors">Ver Calendario</button>
                        <div class="flex items-center space-x-2">
                            <label class="text-sm font-medium text-gray-600">Sala:</label>
                            <select id="filtro-sala" class="border p-1.5 rounded text-sm focus:ring-blue-500 focus:border-blue-500 font-bold bg-blue-50">
                                <option value="TODAS">Todas las salas</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="contenedor-lista" class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100">
                            <tr><th class="p-2">Sala</th><th class="p-2">Día</th><th class="p-2">Horario</th><th class="p-2">Docente / Asignatura</th><th class="p-2">Unidad</th></tr>
                        </thead>
                        <tbody id="tabla-asignaciones" class="divide-y"></tbody>
                    </table>
                </div>
                <div id="contenedor-calendario" class="hidden overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="bg-blue-800 text-white">
                            <tr>
                                <th class="border p-2 text-center w-24">HORA</th><th class="border p-2 text-center w-32">LUNES</th><th class="border p-2 text-center w-32">MARTES</th>
                                <th class="border p-2 text-center w-32">MIÉRCOLES</th><th class="border p-2 text-center w-32">JUEVES</th><th class="border p-2 text-center w-32">VIERNES</th>
                                <th class="border p-2 text-center w-32">SÁBADO</th><th class="border p-2 text-center w-32">DOMINGO</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-calendario"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-password" class="modal-bg hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-lg font-bold mb-4">Cambiar Contraseña</h3>
            <form id="form-password" class="space-y-3">
                <div><label class="block text-sm font-medium">Contraseña Actual</label><input type="password" id="pass-actual" class="w-full border p-2 rounded" required></div>
                <div><label class="block text-sm font-medium">Nueva Contraseña</label><input type="password" id="pass-nueva" class="w-full border p-2 rounded" required></div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button type="button" class="btn-cerrar-modal px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">Actualizar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-usuarios" class="modal-bg hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-lg font-bold mb-4">Registrar Nueva Unidad</h3>
            <form id="form-usuarios" class="space-y-3">
                <div><label class="block text-sm font-medium">Nombre de la Unidad</label><input type="text" id="new-unidad" class="w-full border p-2 rounded" required></div>
                <div><label class="block text-sm font-medium">Usuario (Login)</label><input type="text" id="new-username" class="w-full border p-2 rounded" required></div>
                <div><label class="block text-sm font-medium">Contraseña Inicial</label><input type="password" id="new-password" class="w-full border p-2 rounded" required></div>
                <div><label class="block text-sm font-medium">Rol</label><select id="new-rol" class="w-full border p-2 rounded" required><option value="UNIDAD">Unidad Académica</option><option value="ADMIN">Administrador</option></select></div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button type="button" class="btn-cerrar-modal px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-yellow-500 text-blue-900 rounded hover:bg-yellow-600 font-bold">Crear Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-lista-salas" class="modal-bg hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-[500px] max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-gray-800">Inventario de Salas</h3>
                <button type="button" class="btn-cerrar-modal text-gray-500 hover:text-red-500 text-xl font-bold">&times;</button>
            </div>
            <div id="contenedor-lista-salas" class="space-y-3 overflow-y-auto flex-1 pr-2">
                </div>
        </div>
    </div>

    <div id="modal-editar-sala" class="modal-bg hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h3 class="text-lg font-bold mb-4 text-gray-800">Editar Sala</h3>
            <form id="editar-sala-form" class="space-y-3">
                <input type="hidden" id="edit-sala-id">
                <div><label class="block text-sm font-medium">Nombre de la Sala</label><input type="text" id="edit-sala-nombre" class="w-full border p-2 rounded" required></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium">Capacidad</label><input type="number" id="edit-sala-capacidad" class="w-full border p-2 rounded" required></div>
                    <div><label class="block text-sm font-medium">PCs</label><input type="number" id="edit-sala-computadores" class="w-full border p-2 rounded" required></div>
                </div>
                <div><label class="block text-sm font-medium">Detalles</label><input type="text" id="edit-sala-detalles" class="w-full border p-2 rounded"></div>
                <div class="flex justify-end space-x-2 mt-4 pt-2 border-t">
                    <button type="button" class="btn-cerrar-modal px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 font-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
