<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Salas de Sistemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --intep-azul-claro: #0099db;
            --intep-azul: #005C9E;
            --intep-amarillo: #F8C300;
        }
        
        body {
            font-family: 'Inter', Arial, sans-serif;
        }
        
        h1, h2, h3, h4, h5, h6, .navbar-brand, .card-title {
            font-family: 'Montserrat', 'Arial Black', sans-serif;
        }
        
        .bg-intep { 
            background-color: var(--intep-azul) !important; 
        }
        
        .text-intep { 
            color: var(--intep-azul-claro) !important; 
        }
        
        .btn-intep { 
            background-color: var(--intep-azul) !important; 
            color: #ffffff !important; 
            border: none;
        }
        
        .btn-intep:hover { 
            background-color: #004a80 !important;
            color: #ffffff !important; 
        }
        
        .btn-intep-amarillo {
            background-color: var(--intep-amarillo) !important;
            color: var(--intep-azul) !important;
            border: none;
        }
        
        .btn-intep-amarillo:hover {
            background-color: #dfae00 !important;
            color: var(--intep-azul) !important;
        }
        
        .table-intep, .table-intep th { 
            background-color: var(--intep-azul) !important; 
            color: #ffffff !important; 
        }
        
        .celda-reserva { 
            min-width: 160px; 
            height: 95px; 
            transition: background-color 0.2s; 
        }
        
        .celda-reserva:hover { 
            background-color: #f8f9fa; 
        }
    </style>
</head>
<body class="bg-light text-dark">

    <!-- VISTA DE LOGIN -->
    <div id="login-view" class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow border-0 p-4" style="width: 24rem;">
            <div class="card-body text-center">
                <h2 class="card-title fw-bold mb-1 text-intep">Reserva de Salas</h2>
                <div class="mb-4">
                    <img src="https://i.postimg.cc/qM00rjxt/ESCUDO-INTEP-H.png" alt="Logo INTEP" class="img-fluid" style="max-height: 50px;">
                </div>
                <form id="login-form" class="text-start">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Usuario</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-intep w-100 fw-bold py-2 shadow-sm">Ingresar</button>
                    <p id="login-error" class="text-danger text-center mt-3 d-none small fw-bold"></p>
                    <button type="button" id="btn-ver-cronograma-publico" class="btn btn-outline-secondary w-100 fw-bold py-2 shadow-sm mt-2" data-bs-toggle="modal" data-bs-target="#modal-cronograma-publico">Ver Cronograma</button>
                </form>
            </div>
        </div>
    </div>

    <!-- VISTA DE DASHBOARD -->
    <div id="dashboard-view" class="d-none min-vh-100 d-flex flex-column">
        <!-- NAVBAR -->
        <nav class="navbar navbar-dark bg-intep shadow-sm px-4 py-0 d-flex justify-content-between align-items-center">
            <div class="mb-4">
                <img src="https://i.postimg.cc/4d7BCnYf/Logo-b.png" alt="Logo INTEP" class="img-fluid" style="max-height: 70px;">
            </div>
            <div>
                <h1 class="navbar-brand mb-0 h4 fw-bold text-white text-center">GESTIÓN DE SALAS DE SISTEMAS</h1>
                <div id="user-info" class="text-white small fw-medium text-center"></div>
            </div>
            <div class="btn-group dropstart">
                <button type="button" class="btn btn-secondary" data-bs-toggle="dropdown" aria-expanded="false">
                    OPCIONES
                </button>
                <ul class="dropdown-menu">
                    <button id="btn-modal-password" class="dropdown-item text-center">Cambiar Contraseña</button>
                    <button id="btn-modal-salas" class="dropdown-item text-center">Gestionar Salas</button>
                    <button id="btn-modal-usuarios" class="dropdown-item text-center">Nuevo Usuario</button>
                    <button id="btn-logout" class="dropdown-item text-white text-center rounded" style="background-color: #f72b24;">Cerrar Sesión</button>
                </ul>
            </div>
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="container-fluid flex-grow-1 p-4">
            <div class="row g-4">
                
                <!-- FORMULARIO DE RESERVA -->
                <div class="col-10 col-md-3 mx-auto">
                    <div class="card shadow-sm p-4 border-0">
                        <h3 class="h5 fw-bold mb-3 border-bottom pb-2 text-dark">Nueva Reserva de Sala</h3>
                        <form id="reserva-form" class="small">
                            <div class="mb-2">
                                <label class="form-label fw-medium mb-1">Sala</label>
                                <select id="sala_id" class="form-select form-select-sm" required></select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label fw-medium mb-1">Docente</label>
                                <input type="text" id="docente" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label fw-medium mb-1">Asignatura</label>
                                <input type="text" id="asignatura" class="form-control form-control-sm" required>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col">
                                    <label class="form-label fw-medium mb-1">Fecha Inicio</label>
                                    <input type="date" id="fecha_inicio" class="form-control form-control-sm" required>
                                </div>
                                <div class="col">
                                    <label class="form-label fw-medium mb-1">Fecha Fin</label>
                                    <input type="date" id="fecha_fin" class="form-control form-control-sm" required>
                                </div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col">
                                    <label class="form-label fw-medium mb-1">Hora Inicio</label>
                                    <input type="time" id="hora_inicio" class="form-control form-control-sm" required>
                                </div>
                                <div class="col">
                                    <label class="form-label fw-medium mb-1">Hora Fin</label>
                                    <input type="time" id="hora_fin" class="form-control form-control-sm" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm py-2">Solicitar Reserva</button>
                        </form>
                    </div>
                </div>

                <!-- CALENDARIO / LISTA DE RESERVAS -->
                <div class="col-12 col-md-9">
                    <div class="card shadow-sm border-0 p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                            <h3 class="h5 fw-bold text-dark mb-0">Programación de Salas</h3>
                            <div class="d-flex gap-2 align-items-center">
                                <label class="form-label fw-medium mb-0 me-2 small">Día de la semana:</label>
                                <select id="filtro-dia" class="form-select form-select-sm" style="width: auto;">
                                    <option value="LUNES">Lunes</option>
                                    <option value="MARTES">Martes</option>
                                    <option value="MIÉRCOLES">Miércoles</option>
                                    <option value="JUEVES">Jueves</option>
                                    <option value="VIERNES">Viernes</option>
                                    <option value="SÁBADO">Sábado</option>
                                </select>
                                <button id="btn-vista" class="btn btn-intep btn-sm fw-bold ms-2 shadow-sm">Ver Lista</button>
                            </div>
                        </div>

                        <!-- VISTA LISTA -->
                        <div id="contenedor-lista" class="table-responsive d-none">
                            <table class="table table-striped table-hover align-middle small mb-0">
                                <thead class="table-intep">
                                    <tr>
                                        <th>Sala</th>
                                        <th>Día</th>
                                        <th>Horario</th>
                                        <th>Periodo</th>
                                        <th>Docente / Asignatura</th>
                                        <th>Unidad Responsable</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-asignaciones"></tbody>
                            </table>
                        </div>

                        <!-- VISTA CALENDARIO -->
                        <div id="contenedor-calendario" class="table-responsive d-none">
                            <table class="table table-bordered align-middle text-center small mb-0">
                                <thead>
                                    <tr id="thead-salas-dinamicas" class="table-intep text-white"></tr>
                                </thead>
                                <tbody id="tbody-calendario"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- MODAL: CAMBIAR CONTRASEÑA -->
    <div class="modal fade" id="modal-password" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Cambiar Contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-password">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Contraseña Actual</label>
                            <input type="password" id="pass-actual" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Nueva Contraseña</label>
                            <input type="password" id="pass-nueva" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-sm btn-intep fw-medium">Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: CREAR USUARIO -->
    <div class="modal fade" id="modal-usuarios" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Registrar Nueva Unidad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-usuarios">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Nombre de la Unidad Académica</label>
                            <input type="text" id="new-unidad" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Usuario (Login)</label>
                            <input type="text" id="new-username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Contraseña Inicial</label>
                            <input type="password" id="new-password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Rol del Usuario</label>
                            <select id="new-rol" class="form-select" required>
                                <option value="UNIDAD">Unidad Académica</option>
                                <option value="ADMIN">Administrador</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-sm btn-warning fw-bold text-dark">Crear Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: INVENTARIO DE SALAS -->
    <div class="modal fade" id="modal-lista-salas" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold text-dark">Inventario de Salas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="max-height: 65vh; overflow-y: auto;">
                    <div id="contenedor-lista-salas" class="d-flex flex-column gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: EDITAR SALA -->
    <div class="modal fade" id="modal-editar-sala" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold text-dark">Editar Sala</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="editar-sala-form">
                    <div class="modal-body">
                        <input type="hidden" id="edit-sala-id">
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Nombre de la Sala</label>
                            <input type="text" id="edit-sala-nombre" class="form-control" required>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col">
                                <label class="form-label small fw-medium">Capacidad Alumnos</label>
                                <input type="number" id="edit-sala-capacidad" class="form-control" required>
                            </div>
                            <div class="col">
                                <label class="form-label small fw-medium">Cantidad PCs</label>
                                <input type="number" id="edit-sala-computadores" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-medium">Detalles / Equipamiento</label>
                            <input type="text" id="edit-sala-detalles" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-sm text-white fw-bold" style="background-color: #6f42c1;">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- MODAL CRONOGRAMA PÚBLICO -->
    <div class="modal fade" id="modal-cronograma-publico" tabindex="-1" aria-hidden="true">
        <div class="text-center modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-intep text-white">
                    <div class="d-flex align-items-center gap-2">
                        <label class="small fw-semibold text-white mb-0">Día:</label>
                        <select id="filtro-dia-publico"
                            class="form-select form-select-sm fw-bold"
                            style="width: auto;">
                            <option value="LUNES">Lunes</option>
                            <option value="MARTES">Martes</option>
                            <option value="MIÉRCOLES">Miércoles</option>
                            <option value="JUEVES">Jueves</option>
                            <option value="VIERNES">Viernes</option>
                            <option value="SÁBADO">Sábado</option>
                            <option value="DOMINGO">Domingo</option>
                        </select>
                    </div>
                    <div class="text-center flex-grow-1">
                        <h5 class="modal-title fw-bold mb-0">CRONOGRAMA DE SALAS</h5>
                        <small class="opacity-75">Consulta pública</small>
                    </div>
                    <div>
                        <button type="button"class="btn-close btn-close-white"data-bs-dismiss="modal"aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body p-0">
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle text-center small mb-0">
                            <thead>
                                <tr id="thead-publico" class="table-intep text-white"></tr>
                            </thead>
                            <tbody id="tbody-publico"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
